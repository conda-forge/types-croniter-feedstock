# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.2.4.20261122"

package:
  name: types-croniter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-croniter/types_croniter-${{ version }}.tar.gz
  sha256: c777dcde6a783dcc3b7959bf3b4e3ea3689dfa2da389270ff9879221b02c2bd0

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=82.0.1
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - croniter-stubs/*.{pyi,typed,toml}
        - types_croniter-${{ version }}.dist-info/**
  - requirements:
      run:
        - croniter
        - mypy
        - python ${{ python_min }}.*
    script:
      - mypy -p croniter

about:
  summary: Typing stubs for croniter
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/types-croniter
  repository: https://github.com/python/typeshed/tree/main/stubs/croniter/croniter

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
